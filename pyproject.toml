[project]
name = "herbtwin"
version = "0.1.0"
description = "Photo of a potted herb in; species, condition, 14-day risk, and one action out."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "langsmith>=0.14.7",
    "openai>=1.50",
    "pillow>=10.4",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits real Token Factory; opt-in with -m live",
    "supabase: needs a local Supabase (supabase start); opt-in with -m supabase",
]
addopts = "-m 'not live and not supabase'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # ruff format wraps code; long prompt strings are allowed
